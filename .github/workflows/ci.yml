name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.10'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify sources, metadata, and references
        run: python scripts/verify.py
      - name: Test packaging, installation, and portable helpers
        run: python -m unittest discover -s tests -v
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

  tools:
    name: Tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: pstack/skills/poteto-mode/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked tool dependencies
        run: bun install --frozen-lockfile
      - name: Test the PR watcher and plan checker
        if: runner.os == 'Linux'
        run: bun run test
      - name: Test portable CLI, policy, and plan behavior
        if: runner.os == 'Windows'
        run: bun test watch-pr/cli.test.ts watch-pr/policy.test.ts check-plan.test.ts
      - name: Check PR watcher types
        run: bun run typecheck
      - name: Check the watcher entry point
        run: bun watch-pr/watch-pr --help
      - name: Test statechart message parsing
        working-directory: .
        run: node --disable-warning=ExperimentalWarning --test pstack/skills/statechart/scripts/test/messages.test.ts
